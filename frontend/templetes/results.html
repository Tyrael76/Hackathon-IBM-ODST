<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extraction Results</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .success-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            color: #2d3748;
            margin-bottom: 10px;
        }

        .message {
            color: #718096;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .stats {
            background: #f7fafc;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #4a5568;
            font-weight: 600;
        }

        .stat-value {
            color: #2d3748;
            font-weight: 700;
        }

        .back-btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #5568d3;
        }

        .error-details {
            background: #fed7d7;
            border-left: 4px solid #c53030;
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            color: #742a2a;
        }

        .security-note {
            background: #c6f6d5;
            border-left: 4px solid #38a169;
            padding: 16px;
            border-radius: 4px;
            margin-top: 20px;
            font-size: 14px;
            color: #22543d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header" id="resultHeader">
            <!-- Content will be injected by JavaScript -->
        </div>

        <div id="resultContent">
            <!-- Content will be injected by JavaScript -->
        </div>

        <div class="security-note">
            <strong>🔒 Security Confirmation:</strong><br>
            Your GitHub token was used securely on the server and has been discarded. 
            No tokens were stored or exposed to the browser.
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a href="oauth_index.html" class="back-btn">← Extract Another Repository</a>
        </div>
    </div>

    <script>
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');
        const files = urlParams.get('files');
        const message = urlParams.get('message');

        const resultHeader = document.getElementById('resultHeader');
        const resultContent = document.getElementById('resultContent');

        if (status === 'success') {
            resultHeader.innerHTML = `
                <div class="success-icon">✅</div>
                <h1>Extraction Successful!</h1>
                <p class="message">Repository data has been extracted and processed securely.</p>
            `;

            resultContent.innerHTML = `
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Status</span>
                        <span class="stat-value" style="color: #38a169;">Success</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Files Extracted</span>
                        <span class="stat-value">${files || 'N/A'}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Authentication Method</span>
                        <span class="stat-value">OAuth 2.0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Token Storage</span>
                        <span class="stat-value" style="color: #38a169;">Ephemeral (Not Stored)</span>
                    </div>
                </div>
            `;
        } else {
            resultHeader.innerHTML = `
                <div class="error-icon">❌</div>
                <h1>Extraction Failed</h1>
                <p class="message">An error occurred during the extraction process.</p>
            `;

            resultContent.innerHTML = `
                <div class="error-details">
                    <strong>Error Details:</strong><br>
                    ${message || 'Unknown error occurred. Please try again.'}
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Status</span>
                        <span class="stat-value" style="color: #c53030;">Failed</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Authentication Method</span>
                        <span class="stat-value">OAuth 2.0</span>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
